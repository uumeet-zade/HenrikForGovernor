<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1180" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="1180" fill="#FFFFFF" />
  
  <!-- Outer Border -->
  <rect x="20" y="20" width="760" height="1140" fill="none" stroke="#000000" stroke-width="8" />

  <!-- Main Title -->
  <text x="40" y="110" fill="#000000" font-family="Impact, Arial Black, system-ui, sans-serif" font-weight="900" font-size="90" letter-spacing="-2">THE PRICE</text>
  <text x="40" y="200" fill="#000000" font-family="Impact, Arial Black, system-ui, sans-serif" font-weight="900" font-size="90" letter-spacing="-2">BEFORE</text>
  <text x="40" y="290" fill="#E60000" font-family="Impact, Arial Black, system-ui, sans-serif" font-weight="900" font-size="90" letter-spacing="-2">THE BUYER.</text>

  <!-- Divider -->
  <line x1="40" y1="340" x2="760" y2="340" stroke="#000000" stroke-width="8" />

  <!-- Point 1: Cyan -->
  <!-- Shadow -->
  <rect x="48" y="388" width="712" height="120" fill="#000000" />
  <!-- Box -->
  <rect x="40" y="380" width="712" height="120" fill="#00FFFF" stroke="#000000" stroke-width="5" />
  <text x="60" y="435" fill="#000000" font-family="Impact, Arial Black, system-ui, sans-serif" font-weight="900" font-size="40" letter-spacing="-1">"A MONOPOLY WEARING A DOCK"</text>
  <text x="60" y="475" fill="#000000" font-family="Arial Black, system-ui, sans-serif" font-weight="900" font-size="18">HALVENT DOESN'T GET TO BE THE ONLY PRICE-SETTER.</text>

  <!-- Point 2: Yellow -->
  <rect x="48" y="548" width="712" height="120" fill="#000000" />
  <rect x="40" y="540" width="712" height="120" fill="#FFCC00" stroke="#000000" stroke-width="5" />
  <text x="60" y="595" fill="#000000" font-family="Impact, Arial Black, system-ui, sans-serif" font-weight="900" font-size="40" letter-spacing="-1">"IT'S NOT WEATHER"</text>
  <text x="60" y="635" fill="#000000" font-family="Arial Black, system-ui, sans-serif" font-weight="900" font-size="18">IT'S A DECISION THAT CAN BE UNMADE.</text>

  <!-- Point 3: Magenta -->
  <rect x="48" y="708" width="712" height="120" fill="#000000" />
  <rect x="40" y="700" width="712" height="120" fill="#FF00FF" stroke="#000000" stroke-width="5" />
  <text x="60" y="755" fill="#FFFFFF" font-family="Impact, Arial Black, system-ui, sans-serif" font-weight="900" font-size="40" letter-spacing="-1">"NO TRICKLE."</text>
  <text x="60" y="795" fill="#FFFFFF" font-family="Arial Black, system-ui, sans-serif" font-weight="900" font-size="18">ENFORCEMENT DOESN'T STOP AT THE WATERLINE.</text>

  <!-- Point 4: Black / Combat -->
  <!-- Shadow is Red for contrast -->
  <rect x="48" y="868" width="712" height="120" fill="#E60000" />
  <rect x="40" y="860" width="712" height="120" fill="#000000" stroke="#000000" stroke-width="5" />
  <text x="60" y="915" fill="#00FFFF" font-family="Impact, Arial Black, system-ui, sans-serif" font-weight="900" font-size="40" letter-spacing="-1">"I KNOW THE PAPERWORK"</text>
  <text x="60" y="955" fill="#FFFFFF" font-family="Arial Black, system-ui, sans-serif" font-weight="900" font-size="18">A GRAIN CONTRACT AND A CATCH CONTRACT READ THE SAME.</text>

  <!-- Footer text -->
  <rect x="40" y="1070" width="712" height="60" fill="#000000" />
  <text x="64" y="1110" fill="#FFFFFF" font-family="Arial Black, system-ui, sans-serif" font-weight="900" font-size="30" letter-spacing="2">HENRIK VASMER FOR GOVERNOR</text>
</svg>
