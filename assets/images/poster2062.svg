<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <clipPath id="inner-frame">
      <rect x="26" y="26" width="748" height="1148" />
    </clipPath>
  </defs>

  <!-- Deep Space Background -->
  <rect width="800" height="1200" fill="#000000" />

  <!-- Everything inside this group will be cut off perfectly at the white frame -->
  <g clip-path="url(#inner-frame)">
    <!-- Subtle Repeating Watermark -->
    <g transform="rotate(-20 400 600)" opacity="0.4">
      <text x="400" y="100" fill="#333333" font-family="Impact, Arial Black, system-ui, sans-serif" font-size="110" font-weight="900" text-anchor="middle">VASMER 2062 VASMER 2062</text>
      <text x="400" y="300" fill="#333333" font-family="Impact, Arial Black, system-ui, sans-serif" font-size="110" font-weight="900" text-anchor="middle">VASMER 2062 VASMER 2062</text>
      <text x="400" y="500" fill="#333333" font-family="Impact, Arial Black, system-ui, sans-serif" font-size="110" font-weight="900" text-anchor="middle">VASMER 2062 VASMER 2062</text>
      <text x="400" y="700" fill="#333333" font-family="Impact, Arial Black, system-ui, sans-serif" font-size="110" font-weight="900" text-anchor="middle">VASMER 2062 VASMER 2062</text>
      <text x="400" y="900" fill="#333333" font-family="Impact, Arial Black, system-ui, sans-serif" font-size="110" font-weight="900" text-anchor="middle">VASMER 2062 VASMER 2062</text>
      <text x="400" y="1100" fill="#333333" font-family="Impact, Arial Black, system-ui, sans-serif" font-size="110" font-weight="900" text-anchor="middle">VASMER 2062 VASMER 2062</text>
      <text x="400" y="1300" fill="#333333" font-family="Impact, Arial Black, system-ui, sans-serif" font-size="110" font-weight="900" text-anchor="middle">VASMER 2062 VASMER 2062</text>
    </g>

    <!-- Chaos Geometry (Cyan & Magenta) -->
    <!-- Cyan Block Offset Shadow -->
    <rect x="170" y="290" width="380" height="380" fill="#E60000" transform="rotate(8 350 470)" />
    <!-- Cyan Block -->
    <rect x="150" y="270" width="380" height="380" fill="#00FFFF" stroke="#FFFFFF" stroke-width="8" transform="rotate(8 350 470)" />
    
    <!-- Circle Offset Shadow -->
    <circle cx="560" cy="540" r="200" fill="#FFCC00" />
    <!-- Red Circle -->
    <circle cx="540" cy="520" r="200" fill="#FF00FF" stroke="#FFFFFF" stroke-width="8" />

    <!-- The 75% Text Layering -->
    <!-- Hard Black Shadow -->
    <text x="410" y="520" fill="#000000" font-family="Impact, Arial Black, system-ui, sans-serif" font-size="280" font-weight="900" letter-spacing="-10" text-anchor="middle" transform="rotate(-6 400 500)">75%</text>
    <!-- White Text with Black Stroke -->
    <text x="400" y="500" fill="#FFFFFF" stroke="#000000" stroke-width="6" font-family="Impact, Arial Black, system-ui, sans-serif" font-size="280" font-weight="900" letter-spacing="-10" text-anchor="middle" transform="rotate(-6 400 500)">75%</text>

    <!-- MANDATE Text Layering -->
    <text x="410" y="700" fill="#000000" font-family="Impact, Arial Black, system-ui, sans-serif" font-size="140" font-weight="900" letter-spacing="-5" text-anchor="middle" transform="rotate(-6 400 500)">MANDATE</text>
    <text x="400" y="685" fill="#E60000" stroke="#FFFFFF" stroke-width="6" font-family="Impact, Arial Black, system-ui, sans-serif" font-size="140" font-weight="900" letter-spacing="-5" text-anchor="middle" transform="rotate(-6 400 500)">MANDATE</text>

    <!-- Hazard Banners -->
    <g transform="rotate(-4 400 800)">
      <!-- Yellow Banner -->
      <rect x="-100" y="800" width="1000" height="70" fill="#FFCC00" stroke="#FFFFFF" stroke-width="8" />
      <text x="400" y="845" fill="#000000" font-family="Arial Black, system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="1" text-anchor="middle">CMC PIPELINE PASSED /// CIVIL DEFENSE ACT</text>
    </g>

    <g transform="rotate(3 400 950)">
      <!-- Cyan Banner -->
      <rect x="-100" y="930" width="1000" height="70" fill="#00FFFF" stroke="#FFFFFF" stroke-width="8" />
      <text x="400" y="975" fill="#000000" font-family="Arial Black, system-ui, sans-serif" font-size="26" font-weight="900" letter-spacing="1" text-anchor="middle">MONOPOLIES BROKEN /// FOUNDATIONS ACT</text>
    </g>

    <!-- Top Header Box -->
    <rect x="52" y="52" width="696" height="120" fill="#E60000" />
    <rect x="40" y="40" width="720" height="120" fill="#FFFFFF" stroke="#000000" stroke-width="8" />
    <text x="400" y="130" fill="#000000" font-family="Impact, Arial Black, system-ui, sans-serif" font-size="85" font-weight="900" letter-spacing="-2" text-anchor="middle">HENRIK VASMER</text>

    <!-- Bottom CTA -->
    <rect x="40" y="1040" width="720" height="100" fill="#000000" stroke="#FFFFFF" stroke-width="8" />
    <text x="400" y="1105" fill="#FFFFFF" font-family="Arial Black, system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="-1" text-anchor="middle">CAMBRIA IS NOT GOING BACK.</text>
  </g>

  <!-- Outer Border on Top of everything to frame the chaos -->
  <!-- Note: We draw it outside the clip path so its stroke is perfectly intact -->
  <rect x="20" y="20" width="760" height="1160" fill="none" stroke="#FFFFFF" stroke-width="12" />
</svg>
