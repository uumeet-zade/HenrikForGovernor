<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <mask id="faviconSlash">
      <rect width="64" height="64" fill="white" />
      <!-- Rotate 30 degrees from the center -->
      <g transform="rotate(30, 32, 32)">
        <!-- A single, much thicker brutalist slash optimized for 16x16px rendering -->
        <rect x="24" y="-20" width="16" height="100" fill="black" />
      </g>
    </mask>
  </defs>
  
  <!-- Thick, bold text optimized for small sizes -->
  <g mask="url(#faviconSlash)">
    <text x="31" y="50" fill="black" font-family="Impact, Arial Black, system-ui, sans-serif" font-size="48" font-weight="900" letter-spacing="-4" text-anchor="middle">HV</text>
  </g>
</svg>
