<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="100%" height="100%">
  <defs>
    <!-- Background Texture -->
    <pattern id="dotPattern" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="2" fill="#333333" />
    </pattern>

    <!-- Slash Mask removed for rasterizer compatibility -->
  </defs>

  <!-- Dark Background -->
  <rect width="1200" height="630" fill="#000000" />
  
  <!-- Subtle Texture -->
  <rect width="1200" height="630" fill="url(#dotPattern)" opacity="0.3" />
  


  <!-- Left Side: Massive Logo (No Mask) -->
  <image href="logos/bloc_logo.svg" x="200" y="150" width="320" height="320" />
  
  <!-- Heavy Brutalist Frame -->
  <rect x="30" y="30" width="1140" height="570" fill="none" stroke="#FFFFFF" stroke-width="12" />
  
  <!-- Divider -->
  <line x1="700" y1="30" x2="700" y2="600" stroke="#FFFFFF" stroke-width="12" />

  <!-- Right Side: Campaign Info -->
  <text x="750" y="240" fill="#FFFFFF" font-family="Arial Black, system-ui, sans-serif" font-size="64" font-weight="900" text-anchor="start">HENRIK</text>
  <text x="750" y="310" fill="#FFFFFF" font-family="Arial Black, system-ui, sans-serif" font-size="64" font-weight="900" text-anchor="start">VASMER</text>
  
  <!-- Red Highlight Box for Slogan -->
  <rect x="750" y="380" width="350" height="80" fill="#E60000" />
  <text x="770" y="440" fill="#FFFFFF" font-family="Impact, Arial Black, system-ui, sans-serif" font-size="52" font-weight="900" letter-spacing="-1" text-anchor="start">FOR GOVERNOR</text>

</svg>
