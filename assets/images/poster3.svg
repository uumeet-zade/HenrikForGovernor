<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1180" width="100%" height="100%">
  <!-- Background - Combat State -->
  <rect width="800" height="1180" fill="#000000" />
  
  <!-- Outer Border -->
  <rect x="20" y="20" width="760" height="1140" fill="none" stroke="#FFFFFF" stroke-width="8" />

  <!-- Main Action Call (Top) -->
  <text x="40" y="110" fill="#FFFFFF" font-family="Impact, Arial Black, system-ui, sans-serif" font-weight="900" font-size="100" letter-spacing="-2">THE TIME</text>
  <text x="40" y="210" fill="#E60000" font-family="Impact, Arial Black, system-ui, sans-serif" font-weight="900" font-size="100" letter-spacing="-2">IS NOW.</text>

  <text x="40" y="270" fill="#FFFFFF" font-family="Arial Black, system-ui, sans-serif" font-weight="900" font-size="22" letter-spacing="1">TAKE BACK THE DOCKS. TAKE BACK THE SOIL.</text>
  
  <!-- Divider -->
  <line x1="40" y1="310" x2="760" y2="310" stroke="#FFFFFF" stroke-width="8" />

  <!-- Placeholder for Henrik Image -->
  <rect x="40" y="350" width="400" height="533" fill="#111111" stroke="#FFFFFF" stroke-width="4" stroke-dasharray="15,15" />
  <text x="75" y="625" fill="#FFFFFF" font-family="Arial Black, system-ui, sans-serif" font-weight="900" font-size="24" opacity="0.3">INSERT HENRIK HERE</text>

  <!-- Right side Calls to Action -->
  <rect x="460" y="420" width="300" height="100" fill="#00FFFF" stroke="#FFFFFF" stroke-width="5" />
  <text x="610" y="465" text-anchor="middle" fill="#000000" font-family="Impact, Arial Black, system-ui, sans-serif" font-weight="900" font-size="38" letter-spacing="-1">FIGHT</text>
  <text x="610" y="495" text-anchor="middle" fill="#000000" font-family="Arial Black, system-ui, sans-serif" font-weight="900" font-size="16">MONOPOLY BUYERS</text>

  <rect x="460" y="550" width="300" height="100" fill="#FFCC00" stroke="#FFFFFF" stroke-width="5" />
  <text x="610" y="595" text-anchor="middle" fill="#000000" font-family="Impact, Arial Black, system-ui, sans-serif" font-weight="900" font-size="38" letter-spacing="-1">REBUILD</text>
  <text x="610" y="625" text-anchor="middle" fill="#000000" font-family="Arial Black, system-ui, sans-serif" font-weight="900" font-size="16">LOCAL CO-OPS</text>

  <rect x="460" y="680" width="300" height="100" fill="#FF00FF" stroke="#FFFFFF" stroke-width="5" />
  <text x="610" y="725" text-anchor="middle" fill="#FFFFFF" font-family="Impact, Arial Black, system-ui, sans-serif" font-weight="900" font-size="38" letter-spacing="-1">DEFEND</text>
  <text x="610" y="755" text-anchor="middle" fill="#FFFFFF" font-family="Arial Black, system-ui, sans-serif" font-weight="900" font-size="16">YOUR CONTRACTS</text>

  <!-- Big JOIN button mockup -->
  <!-- Shadow -->
  <rect x="48" y="1018" width="712" height="120" fill="#FFFFFF" />
  <!-- Box -->
  <rect x="40" y="1010" width="712" height="120" fill="#E60000" stroke="#FFFFFF" stroke-width="5" />
  <text x="210" y="1090" fill="#FFFFFF" font-family="Impact, Arial Black, system-ui, sans-serif" font-weight="900" font-size="64" letter-spacing="-1">JOIN THE FIGHT</text>

</svg>
