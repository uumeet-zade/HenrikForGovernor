<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 1200" width="100%" height="100%">
  <defs>
    <clipPath id="inner-frame">
      <rect x="26" y="26" width="748" height="1148" />
    </clipPath>
    
    <!-- Logo mask for the top-left quadrant -->
    <mask id="strikeMask">
      <rect width="800" height="1200" fill="white" />
      <g transform="rotate(30, 190, 195)">
        <rect x="140" y="0" width="12" height="400" fill="black" />
        <rect x="165" y="0" width="12" height="400" fill="black" />
        <rect x="190" y="0" width="12" height="400" fill="black" />
      </g>
    </mask>
  </defs>

  <rect width="800" height="1200" fill="#FFFFFF" />

  <g clip-path="url(#inner-frame)">
    <!-- Inner Blueprint Frame -->
    <rect x="40" y="40" width="720" height="1120" fill="none" stroke="#000000" stroke-width="6" />

    <!-- Horizontal Dividers -->
    <line x1="40" y1="300" x2="760" y2="300" stroke="#000000" stroke-width="6" />
    <line x1="40" y1="960" x2="760" y2="960" stroke="#000000" stroke-width="6" />
    <line x1="40" y1="1040" x2="760" y2="1040" stroke="#000000" stroke-width="6" />

    <!-- Vertical Dividers -->
    <line x1="360" y1="40" x2="360" y2="300" stroke="#000000" stroke-width="6" />
    <line x1="360" y1="300" x2="360" y2="960" stroke="#000000" stroke-width="6" />

    <!-- Top Left: The Cambrian Bloc Logo -->
    <image href="logos/bloc_logo_bw.svg" x="80" y="50" width="220" height="220" />

    <!-- Top Right: Header Text -->
    <text x="420" y="160" fill="#000000" font-family="Impact, Arial Black, system-ui, sans-serif" font-size="80" font-weight="900" letter-spacing="-2" text-anchor="start">THE 2062</text>
    <text x="420" y="240" fill="#000000" font-family="Impact, Arial Black, system-ui, sans-serif" font-size="80" font-weight="900" letter-spacing="-2" text-anchor="start">PLATFORM</text>
    
    <!-- Middle Left: The Ballot -->
    <text x="200" y="380" fill="#000000" font-family="Arial Black, system-ui, sans-serif" font-size="18" font-weight="900" text-anchor="middle">OFFICIAL ELECTION BALLOT</text>
    <text x="200" y="405" fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1" text-anchor="middle">STATE OF CAMBRIA - 2062</text>
    <line x1="60" y1="435" x2="340" y2="435" stroke="#000000" stroke-width="4" />
    
    <text x="200" y="475" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="middle">VOTE FOR ONE (1) CANDIDATE</text>
    
    <!-- Candidate 1 (Henrik Vasmer) -->
    <rect x="60" y="520" width="280" height="120" fill="none" stroke="#000000" stroke-width="8" />
    <text x="75" y="575" fill="#000000" font-family="Arial Black, system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="start" textLength="160" lengthAdjust="spacingAndGlyphs">HENRIK VASMER</text>
    <text x="75" y="600" fill="#000000" font-family="sans-serif" font-size="10" font-weight="bold" text-anchor="start" textLength="160" lengthAdjust="spacingAndGlyphs">INCUMBENT | THE CAMBRIAN BLOC</text>
    <!-- Checkbox with Scratchy Handwritten Marker X -->
    <rect x="270" y="555" width="50" height="50" fill="none" stroke="#000000" stroke-width="4" />
    <g transform="translate(0, -160)" stroke="#000000" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Stroke 1 (Top-Left to Bottom-Right) -->
      <polyline points="265,708 280,725 310,755 330,772" stroke-width="6" />
      <polyline points="263,710 290,740 328,775" stroke-width="4" />
      <polyline points="268,705 285,730 325,768" stroke-width="5" />
      <!-- Stroke 2 (Top-Right to Bottom-Left) -->
      <polyline points="325,710 305,735 280,750 260,770" stroke-width="7" />
      <polyline points="330,705 310,730 270,765" stroke-width="4" />
      <polyline points="322,715 295,745 265,775" stroke-width="3" />
    </g>

    <!-- Candidate 2 (Conservative) -->
    <rect x="60" y="680" width="280" height="120" fill="none" stroke="#000000" stroke-width="4" />
    <text x="75" y="735" fill="#000000" font-family="Arial Black, system-ui, sans-serif" font-size="12" font-weight="900" letter-spacing="-0.5" text-anchor="start" textLength="160" lengthAdjust="spacingAndGlyphs">CONSERVATIVE CANDIDATE</text>
    <text x="75" y="760" fill="#000000" font-family="sans-serif" font-size="12" font-weight="bold" text-anchor="start" textLength="180" lengthAdjust="spacingAndGlyphs">Establishment Endorsed</text>
    <!-- Empty Checkbox -->
    <rect x="270" y="715" width="50" height="50" fill="none" stroke="#000000" stroke-width="4" />

    <!-- Separator -->
    <line x1="60" y1="860" x2="340" y2="860" stroke="#000000" stroke-width="4" />

    <!-- Middle Right: The Pillars -->
    <text x="390" y="380" fill="#000000" font-family="Arial Black, system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="start">I. SOUTHERN CORRIDOR</text>
    <text x="390" y="420" fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1" text-anchor="start">CMC Pipeline Act Implementation</text>
    <line x1="390" y1="460" x2="720" y2="460" stroke="#000000" stroke-width="2" />

    <text x="390" y="530" fill="#000000" font-family="Arial Black, system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="start">II. DEEPEN COOPERATION</text>
    <text x="390" y="570" fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1" text-anchor="start">Mezata &amp; Costa Blanca Alliances</text>
    <line x1="390" y1="610" x2="720" y2="610" stroke="#000000" stroke-width="2" />

    <text x="390" y="680" fill="#000000" font-family="Arial Black, system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="start">III. GROW WHAT WE PROTECTED</text>
    <text x="390" y="720" fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1" text-anchor="start">Independent Fleets &amp; Co-ops</text>
    <line x1="390" y1="760" x2="720" y2="760" stroke="#000000" stroke-width="2" />

    <text x="390" y="830" fill="#000000" font-family="Arial Black, system-ui, sans-serif" font-size="20" font-weight="900" text-anchor="start">IV. FINISH WHAT WE STARTED</text>
    <text x="390" y="870" fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" letter-spacing="1" text-anchor="start">Defend the 75% Mandate</text>

    <!-- Lower Section: Slogan 1 -->
    <text x="400" y="1025" fill="#000000" font-family="Impact, Arial Black, system-ui, sans-serif" font-size="56" font-weight="900" letter-spacing="-1" text-anchor="middle" textLength="680" lengthAdjust="spacingAndGlyphs">FINISH WHAT WE STARTED.</text>

    <!-- Bottom Footer: Slogan 2 -->
    <rect x="40" y="1040" width="720" height="80" fill="#000000" />
    <text x="400" y="1098" fill="#FFFFFF" font-family="Arial Black, system-ui, sans-serif" font-size="34" font-weight="900" letter-spacing="-1" text-anchor="middle">CAMBRIA IS NOT GOING BACK.</text>
  </g>

  <!-- Outer Border on Top -->
  <rect x="20" y="20" width="760" height="1160" fill="none" stroke="#000000" stroke-width="12" />
</svg>
