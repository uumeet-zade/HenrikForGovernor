<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Henrik Vasmer 2066</title>
    <link rel="icon" href="data:,">
    <meta name="description" content="Progress by Mandate. Sovereignty by Law. Re-elect Governor Henrik Vasmer." />
    <!-- Google Fonts: Outfit -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <!-- CRT Effect Overlay -->
    <div id="crt-overlay"></div>
    
    <!-- Onboarding Modal -->
    <div id="onboarding-modal" class="modal-overlay hidden">
      <div class="brutalist-panel modal-content">
        <h2>Display Settings</h2>
        <p>Configure your viewing preferences before proceeding.</p>
        
        <div class="pref-group mt-1">
          <h4>Visual Theme</h4>
          <label><input type="radio" name="theme-pref" value="night" checked> Night Shift (Dark)</label><br>
          <label><input type="radio" name="theme-pref" value="day"> Day Shift (Light)</label>
        </div>

        <div class="pref-group mt-1">
          <h4>CRT Emulation</h4>
          <label><input type="radio" name="crt-pref" value="on" checked> Engaged</label><br>
          <label><input type="radio" name="crt-pref" value="off"> Disabled</label>
        </div>

        <button id="btn-confirm-prefs" class="btn-primary mt-2 w-full">Confirm Settings</button>
      </div>
    </div>
    
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
